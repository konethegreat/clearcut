[package]
name = "clearcut-pipeline"
description = "ClearCut pipeline: the process_document job handler and its stages (ADR-0017)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
clearcut-core = { path = "../clearcut-core" }
clearcut-docproc = { path = "../clearcut-docproc" }
clearcut-jobs = { path = "../clearcut-jobs" }
clearcut-objects = { path = "../clearcut-objects" }
clearcut-store = { path = "../clearcut-store" }
serde_json = "1.0.154"
sha2 = "0.11"
tokio = { version = "1.53.3", features = ["io-util"] }
tracing = "0.1.44"

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tempfile = "3"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
uuid = "1"
