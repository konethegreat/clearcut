[package]
name = "clearcut-keys"
description = "ClearCut tenant Anthropic keys (ADR-0019): set, check, seal, resolve and remove. Transport-independent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
clearcut-anthropic = { path = "../clearcut-anthropic" }
clearcut-core = { path = "../clearcut-core" }
clearcut-store = { path = "../clearcut-store" }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.55"
tracing = "0.1.44"
uuid = "1"

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
