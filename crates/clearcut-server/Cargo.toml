[package]
name = "clearcut-server"
description = "ClearCut API server (REST today, MCP host next)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
clearcut-core = { path = "../clearcut-core" }
clearcut-intake = { path = "../clearcut-intake" }
clearcut-objects = { path = "../clearcut-objects" }
clearcut-store = { path = "../clearcut-store" }
axum = "0.8.9"
futures-util = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7", default-features = false, features = ["sensitive-headers"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1"

[dev-dependencies]
bytes = "1"
tempfile = "3"
http-body-util = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tower = { version = "0.5", features = ["util"] }
