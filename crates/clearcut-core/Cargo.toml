[package]
name = "clearcut-core"
description = "ClearCut core: money, tax, invoice domain model, lifecycle and South African VAT compliance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
schemars = ["dep:schemars"]

[dependencies]
schemars = { version = "1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
# Reading a stored page reading written before the current shape (ADR-0022) needs a JSON value.
# This is serialisation, not I/O; the crate stays free of network and files.
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = "1"
# Dates are easy to get subtly wrong (leap years, month lengths), so we use a
# well-tested crate. `serde-human-readable` writes dates as "YYYY-MM-DD" in JSON.
time = { version = "0.3.55", default-features = false, features = ["serde-human-readable"] }

[dev-dependencies]
time = { version = "0.3.55", features = ["macros"] }
