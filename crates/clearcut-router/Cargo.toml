[package]
name = "clearcut-router"
description = "ClearCut model router: reads one page, escalating up the ladder on deterministic evidence (ADR-0018)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
clearcut-core = { path = "../clearcut-core" }
clearcut-docproc = { path = "../clearcut-docproc" }
clearcut-pack = { path = "../clearcut-pack" }
clearcut-provider = { path = "../clearcut-provider" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = "1"

[dev-dependencies]
clearcut-core = { path = "../clearcut-core", features = ["schemars"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
