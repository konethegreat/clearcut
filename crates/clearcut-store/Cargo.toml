[package]
name = "clearcut-store"
description = "ClearCut storage: Postgres persistence for tenants, documents, events and the audit log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
clearcut-core = { path = "../clearcut-core" }
getrandom = "0.4"
serde_json = "1.0.154"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "time", "migrate", "macros"] }
thiserror = "2.0.21"
time = "0.3.55"
uuid = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3.55", features = ["macros"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
