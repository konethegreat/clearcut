[package]
name = "clearcut-anthropic"
description = "ClearCut's Anthropic API client: the user's own API key as a protected secret, and a narrow HTTPS client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["time"] }
url = "2"
zeroize = "1"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
