[package]
name = "clearcut-objects"
description = "ClearCut object storage: content-addressed, tenant-scoped storage for uploaded documents (local disk first)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["fs", "io-util", "rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
