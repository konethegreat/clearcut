[package]
name = "clearcut-eval"
description = "ClearCut evaluation: the gold-set label format, its exact loader and checker, and (later) the scorer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "clearcut-gold"
path = "src/main.rs"

[dependencies]
clearcut-core = { path = "../clearcut-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["serde-human-readable"] }

[dev-dependencies]
tempfile = "3"
