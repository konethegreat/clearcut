[package]
name = "clearcut-mcp"
description = "ClearCut MCP server: invoicing tools for AI agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "clearcut-mcp"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
uuid = "1"
clearcut-core = { path = "../clearcut-core", features = ["schemars"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "io-std"] }

[dev-dependencies]
axum = "0.8.9"
tempfile = "3"
