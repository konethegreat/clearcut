[package]
name = "clearcut-docproc"
description = "ClearCut document processing: the trait for reading documents, the HTTP client for the Python worker, and a scripted fake for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
clearcut-core = { path = "../clearcut-core" }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
