name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    # The store tests run against a real Postgres (one throwaway database per test).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clearcut
          # The service only lives for this job and is reachable only from it, so
          # it needs no password (and there is no credential to leak).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: clearcut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearcut -d clearcut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://clearcut@localhost:5432/clearcut
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
  worker:
    # The Python document worker (ADR-0009). Checked on the oldest and the
    # newest Python it supports.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/worker/constraints.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
