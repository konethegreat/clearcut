name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    # The store tests run against a real Postgres (one throwaway database per test).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clearcut
          # The service only lives for this job and is reachable only from it, so
          # it needs no password (and there is no credential to leak).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: clearcut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearcut -d clearcut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://clearcut@localhost:5432/clearcut
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
  worker:
    # The Python document worker (ADR-0009). Checked on the oldest and the
    # newest Python it supports.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/worker/constraints.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - name: Licences (permissive only, ADR-0016)
        run: python tools/licences.py
  contract:
    # The Rust client against the real Python worker (ADR-0009): proves the two
    # sides still understand each other. The token is made fresh for each run and
    # masked in the logs, so there is no secret in the repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/worker/constraints.txt
      - run: pip install -r requirements.txt -c constraints.txt
        working-directory: services/worker
      - name: Start the worker
        working-directory: services/worker
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          echo "CLEARCUT_LIVE_WORKER_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          # A 2-page cap and a 2 MB size cap: two of the contract tests probe those limits.
          CLEARCUT_WORKER_TOKEN="$TOKEN" CLEARCUT_WORKER_MAX_PAGES=2 CLEARCUT_WORKER_MAX_BYTES=2000000 \
            CLEARCUT_WORKER_PORT=8090 PYTHONPATH=src nohup python -m clearcut_worker > "$RUNNER_TEMP/worker.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8090/health > /dev/null && exit 0
            sleep 0.5
          done
          echo "the worker did not start"; cat "$RUNNER_TEMP/worker.log"; exit 1
      - run: cargo test -p clearcut-docproc --test live -- --ignored
        env:
          CLEARCUT_LIVE_WORKER_URL: http://127.0.0.1:8090
      - name: Worker log
        if: failure()
        run: cat "$RUNNER_TEMP/worker.log"
  gold-set:
    # ADR-0010. The repository guard (no real documents or gold-set labels
    # outside the approved fixture folders), and the gold-set tools run on the
    # synthetic samples: the check passes, the test split of the sample results
    # passes the release gate, and the dev split fails it on purpose (the sample
    # results are flawed there), which proves the gate can fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p clearcut-eval
      - name: No documents or gold-set labels outside the approved folders
        run: ./target/debug/clearcut-gold guard .
      - name: The sample gold set is well formed
        run: ./target/debug/clearcut-gold check crates/clearcut-eval/sample
      - name: The test split of the sample results passes the gate
        run: ./target/debug/clearcut-gold score crates/clearcut-eval/sample crates/clearcut-eval/sample-results --split test
      - name: The dev split fails it
        run: |
          if ./target/debug/clearcut-gold score crates/clearcut-eval/sample crates/clearcut-eval/sample-results --split dev > /dev/null; then
            echo "the dev split of the sample results was expected to fail the gate"
            exit 1
          fi
