name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    # The store tests run against a real Postgres (one throwaway database per test).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clearcut
          # The service only lives for this job and is reachable only from it, so
          # it needs no password (and there is no credential to leak).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: clearcut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearcut -d clearcut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://clearcut@localhost:5432/clearcut
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
  worker:
    # The Python document worker (ADR-0009). Checked on the oldest and the
    # newest Python it supports.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/worker/constraints.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Tesseract with English and Afrikaans (the OCR tests use the real program)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-afr
          tesseract --version
          tesseract --list-langs
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - name: Licences (permissive only, ADR-0016)
        run: python tools/licences.py
  compose:
    # The whole stack as a person runs it (docker compose): the images build, the database is made, the
    # restricted login works, the worker is reachable only from the server, and a document goes in,
    # is analysed and waits for a key. Everything here is made fresh and thrown away.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: A throwaway .env (random values, masked in the logs)
        run: |
          for name in CLEARCUT_WORKER_TOKEN DB_OWNER_PASSWORD DB_APP_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> .env
          done
          echo "CLEARCUT_DOMAIN=clearcut.example.test" >> .env
          # The documented deployment: every account brings its own key. This proves the
          # master key and key mode reach the server (the file itself is 0600 and unmounted).
          master=$(openssl rand -base64 32)
          echo "::add-mask::$master"
          echo "CLEARCUT_MASTER_KEY=$master" >> .env
          echo "CLEARCUT_KEY_MODE=tenant-only" >> .env
      - name: The compose files are valid, with and without HTTPS
        run: |
          docker compose config -q
          docker compose --profile https config -q
      - name: Build and start
        run: docker compose up --build -d
      - name: The server answers
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8099/health > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8099/health
          curl -sf -o /dev/null http://127.0.0.1:8099/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/v1/documents)" = 401
      - name: A document goes in and is analysed, then waits for a key
        run: |
          TENANT=$(docker compose run --rm -T admin create-tenant ci </dev/null 2>/dev/null | grep -o '^[0-9a-f-]\{36\}' | head -1)
          KEY=$(docker compose run --rm -T admin create-key --tenant "$TENANT" --name ci --scopes documents:write,documents:read </dev/null 2>/dev/null | head -1)
          echo "::add-mask::$KEY"
          python3 deploy/make-test-pdf.py > ci.pdf
          ID=$(curl -sf -X POST "http://127.0.0.1:8099/v1/documents?filename=ci.pdf" -H "Authorization: Bearer $KEY" -H "Content-Type: application/pdf" --data-binary @ci.pdf | grep -o '"document_id":"[^"]*"' | cut -d'"' -f4)
          test -n "$ID"
          for i in $(seq 1 30); do
            JOBS=$(curl -sf "http://127.0.0.1:8099/v1/documents/$ID/jobs" -H "Authorization: Bearer $KEY")
            echo "$JOBS" | grep -q 'waiting for an Anthropic key' && exit 0
            sleep 2
          done
          echo "the document was not analysed and held for a key: $JOBS"; exit 1
      - name: What the containers said, if anything failed
        if: failure()
        run: docker compose logs --no-color --tail 80
      - name: Clean up
        if: always()
        run: docker compose down -v
  contract:
    # The Rust client against the real Python worker (ADR-0009): proves the two
    # sides still understand each other. The token is made fresh for each run and
    # masked in the logs, so there is no secret in the repository. The pipeline's
    # live test (ADR-0017) also needs a database, as in the rust job.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clearcut
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: clearcut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearcut -d clearcut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/worker/constraints.txt
      - run: pip install -r requirements.txt -c constraints.txt
        working-directory: services/worker
      - name: Tesseract with English and Afrikaans (so OCR is exercised through the client too)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-afr
      - name: Start the worker
        working-directory: services/worker
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          echo "CLEARCUT_LIVE_WORKER_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          # A 2-page cap and a 2 MB size cap: two of the contract tests probe those limits.
          CLEARCUT_WORKER_TOKEN="$TOKEN" CLEARCUT_WORKER_MAX_PAGES=2 CLEARCUT_WORKER_MAX_BYTES=2000000 \
            CLEARCUT_WORKER_TESSERACT=tesseract CLEARCUT_WORKER_PORT=8090 PYTHONPATH=src nohup python -m clearcut_worker > "$RUNNER_TEMP/worker.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8090/health > /dev/null && exit 0
            sleep 0.5
          done
          echo "the worker did not start"; cat "$RUNNER_TEMP/worker.log"; exit 1
      - run: cargo test -p clearcut-docproc --test live -- --ignored
        env:
          CLEARCUT_LIVE_WORKER_URL: http://127.0.0.1:8090
      - name: The analysis stage on PDFs whose text layer lies (real PDF reader, real OCR)
        run: cargo test -p clearcut-pipeline --test live -- --ignored
        env:
          CLEARCUT_LIVE_WORKER_URL: http://127.0.0.1:8090
          DATABASE_URL: postgres://clearcut@localhost:5432/clearcut
      - name: Worker log
        if: failure()
        run: cat "$RUNNER_TEMP/worker.log"
  gold-set:
    # ADR-0010. The repository guard (no real documents or gold-set labels
    # outside the approved fixture folders), and the gold-set tools run on the
    # synthetic samples: the check passes, the test split of the sample results
    # passes the release gate, and the dev split fails it on purpose (the sample
    # results are flawed there), which proves the gate can fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p clearcut-eval
      - name: No documents or gold-set labels outside the approved folders
        run: ./target/debug/clearcut-gold guard .
      - name: The sample gold set is well formed
        run: ./target/debug/clearcut-gold check crates/clearcut-eval/sample
      - name: The test split of the sample results passes the gate
        run: ./target/debug/clearcut-gold score crates/clearcut-eval/sample crates/clearcut-eval/sample-results --split test
      - name: The dev split fails it
        run: |
          if ./target/debug/clearcut-gold score crates/clearcut-eval/sample crates/clearcut-eval/sample-results --split dev > /dev/null; then
            echo "the dev split of the sample results was expected to fail the gate"
            exit 1
          fi
