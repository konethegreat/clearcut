# Written by Kone Tshivhinda & Claude
# ClearCut on your own computer: one command.   docker compose up --build
#
# Put your settings in a file called .env next to this one (see docs/RUN-LOCALLY.md):
#   ANTHROPIC_API_KEY=sk-ant-...          your own key (optional: without it documents are only analysed)
#   CLEARCUT_WORKER_TOKEN=some-long-random-text
#   DB_OWNER_PASSWORD=letters-and-digits  the database owner (makes the tables)
#   DB_APP_PASSWORD=other-letters-digits  the restricted login the server uses
# The web page is then at http://127.0.0.1:8099 (only this computer can reach it).
#
# Networks (each internal one has NO internet):
#   db_net      the database, and the things that may talk to it: migrate, roles, admin, the server
#   worker_net  the document worker and the server only
#   outside     the server only (it must reach Anthropic); it also publishes the page, on this computer
#   edge        the server and, with `--profile https`, Caddy (HTTPS for a deployment: docs/DEPLOY.md)
# The worker reads untrusted files, so it has no route to the database and no password for it.
name: clearcut

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: clearcut
      POSTGRES_DB: clearcut
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?put DB_OWNER_PASSWORD=letters-and-digits in the .env file}
    volumes:
      - db:/var/lib/postgresql/data
    networks: [db_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearcut -d clearcut"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    # Makes the tables (safe to repeat). Needs the owner login, which the server never has.
    build: .
    image: clearcut-server
    command: ["clearcut-admin", "migrate"]
    environment:
      DATABASE_URL: postgres://clearcut@db:5432/clearcut
      PGPASSWORD: ${DB_OWNER_PASSWORD}
    networks: [db_net]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  roles:
    # Gives the server's restricted login its password (the tables' migration cannot know it).
    image: postgres:17
    entrypoint: ["sh", "-c", "echo \"alter role clearcut_app with password :'p';\" | psql postgres://clearcut@db:5432/clearcut -v ON_ERROR_STOP=1 -v p=\"$$DB_APP_PASSWORD\""]
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?put DB_APP_PASSWORD=other-letters-and-digits in the .env file}
    networks: [db_net]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  admin:
    # The operator's command, for making your first login (see docs/RUN-LOCALLY.md):
    #   docker compose run --rm admin create-tenant "My firm"
    profiles: ["tools"]
    build: .
    image: clearcut-server
    entrypoint: ["clearcut-admin"]
    environment:
      DATABASE_URL: postgres://clearcut@db:5432/clearcut
      PGPASSWORD: ${DB_OWNER_PASSWORD}
    networks: [db_net]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build:
      context: services/worker
    image: clearcut-worker
    restart: unless-stopped
    environment:
      CLEARCUT_WORKER_TOKEN: ${CLEARCUT_WORKER_TOKEN:?put CLEARCUT_WORKER_TOKEN=some-long-random-text in the .env file}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [worker_net]

  server:
    build: .
    image: clearcut-server
    restart: unless-stopped
    environment:
      # The restricted login: row-level security applies to it, and it cannot change the tables.
      DATABASE_URL: postgres://clearcut_app@db:5432/clearcut
      PGPASSWORD: ${DB_APP_PASSWORD}
      CLEARCUT_WORKER_URL: http://worker:8090
      CLEARCUT_WORKER_TOKEN: ${CLEARCUT_WORKER_TOKEN:?put CLEARCUT_WORKER_TOKEN=some-long-random-text in the .env file}
      # The rest of .env, passed explicitly. The server must not need to read the file:
      # it runs as its own user inside the container, so a 0600 .env would be unreadable.
      CLEARCUT_MASTER_KEY: ${CLEARCUT_MASTER_KEY:-}
      CLEARCUT_MASTER_KEY_FILE: ${CLEARCUT_MASTER_KEY_FILE:-}
      CLEARCUT_MASTER_KEY_ID: ${CLEARCUT_MASTER_KEY_ID:-}
      CLEARCUT_KEY_MODE: ${CLEARCUT_KEY_MODE:-}
      CLEARCUT_RETENTION_DAYS: ${CLEARCUT_RETENTION_DAYS:-}
      CLEARCUT_RUNNER_CONCURRENCY: ${CLEARCUT_RUNNER_CONCURRENCY:-}
      CLEARCUT_TENANT_QUOTA_BYTES: ${CLEARCUT_TENANT_QUOTA_BYTES:-}
      CLEARCUT_RATE_LIMIT_PER_MINUTE: ${CLEARCUT_RATE_LIMIT_PER_MINUTE:-}
      CLEARCUT_MAX_UPLOAD_BYTES: ${CLEARCUT_MAX_UPLOAD_BYTES:-}
      # The guard in front of authentication (docs/DEPLOY.md). CLEARCUT_TRUST_PROXY=1 only when
      # Caddy is in front: it makes the last X-Forwarded-For entry the client's address.
      CLEARCUT_TRUST_PROXY: ${CLEARCUT_TRUST_PROXY:-}
      CLEARCUT_PER_IP_PER_MINUTE: ${CLEARCUT_PER_IP_PER_MINUTE:-}
      CLEARCUT_AUTH_FAILURES_PER_MINUTE: ${CLEARCUT_AUTH_FAILURES_PER_MINUTE:-}
      CLEARCUT_BLOCK_SECONDS: ${CLEARCUT_BLOCK_SECONDS:-}
      CLEARCUT_MAX_CONCURRENT: ${CLEARCUT_MAX_CONCURRENT:-}
      CLEARCUT_REQUEST_TIMEOUT_SECONDS: ${CLEARCUT_REQUEST_TIMEOUT_SECONDS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLEARCUT_ANTHROPIC_BASE_URL: ${CLEARCUT_ANTHROPIC_BASE_URL:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - files:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8099:8080"
    networks: [db_net, worker_net, outside, edge]
    depends_on:
      roles: { condition: service_completed_successfully }
      worker: { condition: service_started }

  caddy:
    # HTTPS for a deployment: a free certificate that renews itself. Only with `--profile https`, and only
    # after CLEARCUT_DOMAIN points at this machine (docs/DEPLOY.md). It reaches the server and nothing else.
    profiles: ["https"]
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      # Without a real domain Caddy serves only https://localhost (not reachable from outside).
      CLEARCUT_DOMAIN: ${CLEARCUT_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    depends_on:
      server: { condition: service_started }

volumes:
  db:
  files:
  caddy_data:
  caddy_config:

networks:
  db_net:
    internal: true
  worker_net:
    internal: true
  outside: {}
  edge: {}
